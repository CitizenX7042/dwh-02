[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danor-etl"
version = "0.1.0"
description = "Portable read-only ETL from Softwise DANOR13 to Azure SQL staging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyodbc>=5.1.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
danor-etl = "danor_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
